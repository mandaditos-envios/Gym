<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Tracker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080c11;
    color: white;
}

button, input, select {
    font-family: inherit;
}

.app {
    max-width: 520px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 30px;
}

header {
    padding: 25px 18px 15px;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.week {
    color: #8993a1;
    font-size: 12px;
    margin-top: 5px;
}

.summary {
    margin: 10px 16px 20px;
    padding: 18px;
    border-radius: 18px;
    background: #151b23;
    display: flex;
    justify-content: space-between;
}

.summary span {
    display: block;
    color: #8993a1;
    font-size: 12px;
    margin-bottom: 5px;
}

.summary strong {
    font-size: 22px;
}

.content {
    padding: 0 16px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 14px;
}

.muscle-card {
    background: #151b23;
    padding: 16px;
    border-radius: 17px;
    margin-bottom: 11px;
    cursor: pointer;
}

.muscle-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.muscle-name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
}

.icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: #202832;
    display: flex;
    align-items: center;
    justify-content: center;
}

.muscle-count {
    color: #9ba5b3;
    font-size: 13px;
}

.progress {
    height: 8px;
    background: #252d37;
    border-radius: 20px;
    margin-top: 13px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    border-radius: 20px;
    transition: width .3s;
}

.progress-text {
    color: #8b95a3;
    font-size: 11px;
    text-align: right;
    margin-top: 5px;
}

.primary-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: #2878f0;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-top: 10px;
}

.primary-btn:active {
    transform: scale(.98);
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.page-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 18px;
}

.page-header h2 {
    font-size: 21px;
}

.back {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: #151b23;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.form {
    padding: 0 18px;
}

label {
    display: block;
    color: #9ba5b3;
    font-size: 13px;
    margin: 17px 0 7px;
}

input, select {
    width: 100%;
    padding: 14px;
    background: #151b23;
    color: white;
    border: 1px solid #29323d;
    border-radius: 12px;
    outline: none;
}

input:focus, select:focus {
    border-color: #2878f0;
}

.exercise-card {
    background: #151b23;
    padding: 17px;
    border-radius: 16px;
    margin-bottom: 12px;
    cursor: pointer;
}

.exercise-top {
    display: flex;
    justify-content: space-between;
}

.exercise-name {
    font-weight: bold;
}

.exercise-series {
    color: #55d66f;
    font-size: 13px;
}

.stats-box {
    background: #151b23;
    margin: 0 18px 18px;
    padding: 18px;
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
}

.stats-box span {
    display: block;
    color: #8993a1;
    font-size: 11px;
}

.stats-box strong {
    display: block;
    font-size: 19px;
    margin-top: 5px;
}

.green {
    color: #55d66f;
}

.set-header, .set-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 44px 28px;
    gap: 6px;
    align-items: center;
}

.set-header {
    padding: 0 18px 7px;
    color: #8993a1;
    font-size: 11px;
    text-align: center;
}

.set-row {
    padding: 5px 18px;
}

.set-number {
    background: #151b23;
    padding: 11px 0;
    border-radius: 9px;
    text-align: center;
    color: #aab3c0;
    font-size: 13px;
}

.set-row input {
    padding: 10px;
    text-align: center;
}

.check-btn {
    height: 38px;
    border: 1px solid #29323d;
    background: #151b23;
    border-radius: 9px;
    color: #555;
    font-size: 16px;
    cursor: pointer;
}

.check-btn.done {
    background: #14331d;
    border-color: #55d66f;
    color: #55d66f;
}

.delete-set {
    border: none;
    background: none;
    color: #ff5050;
    font-size: 20px;
    cursor: pointer;
}

.total-box {
    margin: 15px 18px;
    padding: 15px;
    border-radius: 14px;
    background: #151b23;
    text-align: center;
}

.empty {
    text-align: center;
    color: #8993a1;
    padding: 30px 10px;
}

.success {
    margin: 15px 18px;
    padding: 15px;
    background: #14331d;
    color: #5ce477;
    border-radius: 14px;
    text-align: center;
}
</style>
</head>
<body>

<div class="app">

    <!-- INICIO -->
    <div id="homeScreen" class="screen active">
        <header>
            <div class="logo">GYM TRACKER</div>
            <div class="week" id="weekLabel"></div>
        </header>

        <div class="summary">
            <div>
                <span>Series completadas</span>
                <strong id="totalDone">0</strong>
            </div>
            <div>
                <span>Series restantes</span>
                <strong id="totalRemaining">0</strong>
            </div>
        </div>

        <div class="content">
            <div class="section-title">Grupos musculares</div>
            <div id="muscleList"></div>
            <button class="primary-btn" id="homeAddExercise">＋ Agregar ejercicio</button>
        </div>
    </div>

    <!-- AGREGAR EJERCICIO -->
    <div id="addScreen" class="screen">
        <div class="page-header">
            <button class="back" id="backFromAdd">‹</button>
            <h2>Agregar ejercicio</h2>
        </div>
        <div class="form">
            <label for="exerciseName">Nombre del ejercicio</label>
            <input id="exerciseName" type="text" placeholder="Ej: Curl de bíceps">

            <label for="exerciseMuscle">Grupo muscular</label>
            <select id="exerciseMuscle"></select>

            <button class="primary-btn" id="saveExerciseBtn">Guardar ejercicio</button>
        </div>
    </div>

    <!-- GRUPO MUSCULAR -->
    <div id="muscleScreen" class="screen">
        <div class="page-header">
            <button class="back" id="backFromMuscle">‹</button>
            <h2 id="muscleTitle">Músculo</h2>
        </div>
        <div id="exerciseList" class="content"></div>
        <div class="content">
            <button class="primary-btn" id="muscleAddExercise">＋ Agregar ejercicio</button>
        </div>
    </div>

    <!-- EJERCICIO -->
    <div id="exerciseScreen" class="screen">
        <div class="page-header">
            <button class="back" id="backFromExercise">‹</button>
            <h2 id="exerciseTitle">Ejercicio</h2>
        </div>

        <div class="stats-box">
            <div>
                <span>Objetivo semanal</span>
                <strong id="exerciseGoal">0</strong>
            </div>
            <div>
                <span>Completadas</span>
                <strong id="exerciseDone">0</strong>
            </div>
            <div>
                <span>Faltan</span>
                <strong class="green" id="exerciseRemaining">0</strong>
            </div>
        </div>

        <div class="set-header">
            <div>#</div>
            <div>Reps</div>
            <div>Peso kg</div>
            <div>Hecha</div>
            <div></div>
        </div>

        <div id="setsList"></div>

        <div class="total-box">
            Series configuradas: <strong id="setTotal">0</strong>
        </div>

        <div class="content">
            <button class="primary-btn" id="addSetBtn">＋ Agregar serie</button>
            <button class="primary-btn" id="saveSetsBtn">💾 Guardar cambios de peso/reps</button>
        </div>

        <div id="successMessage"></div>
    </div>

</div>

<script>
const muscleGoals = {
    "Pecho": 14, "Espalda": 16, "Hombros": 12, "Bíceps": 12,
    "Tríceps": 12, "Cuádriceps": 12, "Isquios": 10, "Glúteos": 10,
    "Aductores": 6, "Abductores": 6, "Pantorrillas": 10
};

const muscleIcons = {
    "Pecho": "🫀", "Espalda": "🔵", "Hombros": "🟡", "Bíceps": "💪",
    "Tríceps": "🟣", "Cuádriceps": "🦵", "Isquios": "🦵", "Glúteos": "🍑",
    "Aductores": "🟠", "Abductores": "🟠", "Pantorrillas": "🔷"
};

const colors = {
    "Pecho": "#ff4444", "Espalda": "#2878f0", "Hombros": "#ffc400", "Bíceps": "#4bd15f",
    "Tríceps": "#a855f7", "Cuádriceps": "#ff7a18", "Isquios": "#ff7a18", "Glúteos": "#ff4f9a",
    "Aductores": "#ff8b22", "Abductores": "#ff8b22", "Pantorrillas": "#26b7c7"
};

/* ==================================================
   RECUPERACIÓN Y MIGRACIÓN AUTOMÁTICA
================================================== */
let exercises = JSON.parse(localStorage.getItem("gymExercises")) || [];
let oldWorkouts = JSON.parse(localStorage.getItem("gymWorkouts")) || {};
let weeklyLog = JSON.parse(localStorage.getItem("gymWeeklyLog")) || {};

// Si tenías datos guardados en el formato anterior, se recuperan acá
exercises.forEach(ex => {
    if (!ex.sets || ex.sets.length === 0) {
        let restoredSets = null;
        Object.keys(oldWorkouts).forEach(week => {
            if (oldWorkouts[week]?.[ex.id] && oldWorkouts[week][ex.id].length > 0) {
                restoredSets = oldWorkouts[week][ex.id];
            }
        });
        ex.sets = restoredSets || [
            { reps: 10, weight: 0 },
            { reps: 10, weight: 0 },
            { reps: 10, weight: 0 }
        ];
    }
});
localStorage.setItem("gymExercises", JSON.stringify(exercises));

let currentMuscle = null;
let currentExercise = null;

function getWeekKey() {
    const now = new Date();
    const date = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
    const day = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    return `${date.getUTCFullYear()}-W${week}`;
}

const currentWeek = getWeekKey();
document.getElementById("weekLabel").textContent = "Semana " + currentWeek;

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function showHome() {
    updateHome();
    showScreen("homeScreen");
}

function getExerciseDoneSets(exerciseId) {
    return weeklyLog[currentWeek]?.[exerciseId] || [];
}

function getMuscleCompletedSets(muscle) {
    let count = 0;
    exercises
        .filter(ex => ex.muscle === muscle)
        .forEach(ex => {
            count += getExerciseDoneSets(ex.id).length;
        });
    return count;
}

function updateHome() {
    const list = document.getElementById("muscleList");
    list.innerHTML = "";
    let totalDone = 0;
    let totalGoal = 0;

    Object.keys(muscleGoals).forEach(muscle => {
        const goal = muscleGoals[muscle];
        const done = getMuscleCompletedSets(muscle);
        const percentage = Math.min((done / goal) * 100, 100);

        totalDone += done;
        totalGoal += goal;

        const card = document.createElement("div");
        card.className = "muscle-card";
        card.innerHTML = `
            <div class="muscle-top">
                <div class="muscle-name">
                    <div class="icon" style="color:${colors[muscle]}">${muscleIcons[muscle]}</div>
                    ${muscle}
                </div>
                <div class="muscle-count">${done} / ${goal} series</div>
            </div>
            <div class="progress">
                <div class="progress-bar" style="width:${percentage}%; background:${colors[muscle]}"></div>
            </div>
            <div class="progress-text">${Math.round(percentage)}%</div>
        `;
        card.addEventListener("click", () => openMuscle(muscle));
        list.appendChild(card);
    });

    document.getElementById("totalDone").textContent = totalDone;
    document.getElementById("totalRemaining").textContent = Math.max(totalGoal - totalDone, 0);
}

function openAddExercise(fromMuscle = null) {
    currentMuscle = fromMuscle;
    const select = document.getElementById("exerciseMuscle");
    select.innerHTML = "";

    Object.keys(muscleGoals).forEach(muscle => {
        const option = document.createElement("option");
        option.value = muscle;
        option.textContent = muscle;
        select.appendChild(option);
    });

    if (currentMuscle) {
        select.value = currentMuscle;
    }

    document.getElementById("exerciseName").value = "";
    showScreen("addScreen");
}

function saveExercise() {
    const nameInput = document.getElementById("exerciseName");
    const name = nameInput.value.trim();
    const muscle = document.getElementById("exerciseMuscle").value;

    if (!name) {
        alert("Escribí el nombre del ejercicio.");
        return;
    }

    const newExercise = {
        id: Date.now(),
        name: name,
        muscle: muscle,
        sets: [
            { reps: 10, weight: 0 },
            { reps: 10, weight: 0 },
            { reps: 10, weight: 0 }
        ]
    };

    exercises.push(newExercise);
    saveExercisesData();

    nameInput.value = "";
    openMuscle(muscle);
}

function openMuscle(muscle) {
    currentMuscle = muscle;
    document.getElementById("muscleTitle").textContent = muscle;

    const list = document.getElementById("exerciseList");
    list.innerHTML = "";

    const muscleExercises = exercises.filter(ex => ex.muscle === muscle);

    if (muscleExercises.length === 0) {
        list.innerHTML = `<div class="empty">Todavía no agregaste ejercicios para ${muscle}.</div>`;
    } else {
        muscleExercises.forEach(exercise => {
            const done = getExerciseDoneSets(exercise.id).length;
            const totalSets = exercise.sets?.length || 0;
            const card = document.createElement("div");
            card.className = "exercise-card";
            card.innerHTML = `
                <div class="exercise-top">
                    <div class="exercise-name">${exercise.name}</div>
                    <div class="exercise-series">${done} / ${totalSets} esta semana</div>
                </div>
            `;
            card.addEventListener("click", () => openExercise(exercise.id));
            list.appendChild(card);
        });
    }

    showScreen("muscleScreen");
}

function openExercise(id) {
    currentExercise = id;
    const exercise = exercises.find(e => e.id === id);
    if (!exercise) return;

    if (!exercise.sets) exercise.sets = [];

    currentMuscle = exercise.muscle;
    document.getElementById("exerciseTitle").textContent = exercise.name;

    const goal = muscleGoals[exercise.muscle];
    const completedSets = getExerciseDoneSets(id).length;

    document.getElementById("exerciseGoal").textContent = goal;
    document.getElementById("exerciseDone").textContent = completedSets;
    document.getElementById("exerciseRemaining").textContent = Math.max(goal - getMuscleCompletedSets(exercise.muscle), 0);

    renderSets(exercise);
    document.getElementById("successMessage").innerHTML = "";
    showScreen("exerciseScreen");
}

function renderSets(exercise) {
    const list = document.getElementById("setsList");
    list.innerHTML = "";
    const doneIndexes = getExerciseDoneSets(exercise.id);

    exercise.sets.forEach((set, index) => {
        const isDone = doneIndexes.includes(index);
        const row = document.createElement("div");
        row.className = "set-row";
        row.innerHTML = `
            <div class="set-number">${index + 1}</div>
            <input type="number" min="0" placeholder="Reps" value="${set.reps !== undefined ? set.reps : ""}" data-index="${index}" data-type="reps">
            <input type="number" min="0" step="0.5" placeholder="Kg" value="${set.weight !== undefined ? set.weight : ""}" data-index="${index}" data-type="weight">
            <button class="check-btn ${isDone ? "done" : ""}" data-check="${index}">
                ${isDone ? "✓" : "○"}
            </button>
            <button class="delete-set" data-delete="${index}">×</button>
        `;

        row.querySelector("[data-check]").addEventListener("click", () => toggleSetDone(index));
        row.querySelector("[data-delete]").addEventListener("click", () => deleteSet(index));
        list.appendChild(row);
    });

    document.getElementById("setTotal").textContent = exercise.sets.length;
}

function toggleSetDone(setIndex) {
    if (!weeklyLog[currentWeek]) weeklyLog[currentWeek] = {};
    if (!weeklyLog[currentWeek][currentExercise]) weeklyLog[currentWeek][currentExercise] = [];

    const doneList = weeklyLog[currentWeek][currentExercise];
    const foundIndex = doneList.indexOf(setIndex);

    if (foundIndex > -1) {
        doneList.splice(foundIndex, 1);
    } else {
        doneList.push(setIndex);
    }

    saveWeeklyData();
    openExercise(currentExercise);
}

function addSet() {
    const exercise = exercises.find(e => e.id === currentExercise);
    if (!exercise) return;

    const lastSet = exercise.sets[exercise.sets.length - 1] || { reps: 10, weight: 0 };
    exercise.sets.push({ reps: lastSet.reps, weight: lastSet.weight });

    saveExercisesData();
    openExercise(currentExercise);
}

function saveSets() {
    const inputs = document.querySelectorAll("#setsList input");
    const exercise = exercises.find(e => e.id === currentExercise);
    if (!exercise) return;

    inputs.forEach(input => {
        const index = Number(input.dataset.index);
        const type = input.dataset.type;
        if (exercise.sets[index]) {
            exercise.sets[index][type] = input.value === "" ? "" : Number(input.value);
        }
    });

    saveExercisesData();

    const total = getMuscleCompletedSets(exercise.muscle);
    const goal = muscleGoals[exercise.muscle];
    const messageBox = document.getElementById("successMessage");

    if (total >= goal) {
        messageBox.innerHTML = `<div class="success">✅ ¡Objetivo semanal de ${exercise.muscle} completado! (${total}/${goal})</div>`;
    } else {
        messageBox.innerHTML = `<div class="success">Valores guardados. Llevás ${total}/${goal} series semanales.</div>`;
    }
}

function deleteSet(index) {
    if (!confirm("¿Querés eliminar esta serie del ejercicio?")) return;

    const exercise = exercises.find(e => e.id === currentExercise);
    if (!exercise) return;

    exercise.sets.splice(index, 1);

    if (weeklyLog[currentWeek]?.[currentExercise]) {
        weeklyLog[currentWeek][currentExercise] = weeklyLog[currentWeek][currentExercise]
            .filter(i => i !== index)
            .map(i => (i > index ? i - 1 : i));
        saveWeeklyData();
    }

    saveExercisesData();
    openExercise(currentExercise);
}

function saveExercisesData() {
    localStorage.setItem("gymExercises", JSON.stringify(exercises));
}

function saveWeeklyData() {
    localStorage.setItem("gymWeeklyLog", JSON.stringify(weeklyLog));
}

// LISTENERS
document.getElementById("homeAddExercise").addEventListener("click", () => openAddExercise(null));
document.getElementById("muscleAddExercise").addEventListener("click", () => openAddExercise(currentMuscle));
document.getElementById("saveExerciseBtn").addEventListener("click", saveExercise);
document.getElementById("addSetBtn").addEventListener("click", addSet);
document.getElementById("saveSetsBtn").addEventListener("click", saveSets);

document.getElementById("backFromAdd").addEventListener("click", () => {
    if (currentMuscle) {
        openMuscle(currentMuscle);
    } else {
        showHome();
    }
});

document.getElementById("backFromMuscle").addEventListene
